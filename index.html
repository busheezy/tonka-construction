<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construction</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100dvh;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #wrap {
        position: relative;
        width: min(100vw, calc(100dvh * 4 / 3));
        aspect-ratio: 4 / 3;
        margin: 0 auto;
        top: 50%;
        transform: translateY(-50%);
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        user-select: none;
      }
      #volume {
        position: fixed;
        right: 12px;
        bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgb(0 0 0 / 55%);
        opacity: 0.6;
        transition: opacity 0.2s;
      }
      #volume:hover,
      #volume:focus-within {
        opacity: 1;
      }
      #mute {
        font-size: 18px;
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 0;
      }
      #volume-slider {
        width: 110px;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-size: 20px;
        text-align: center;
        padding: 16px;
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay button {
        font-size: 24px;
        padding: 12px 28px;
        cursor: pointer;
      }
      #overlay code {
        background: #222;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="stage" width="640" height="480"></canvas>
      <div id="overlay"><div id="message"></div></div>
    </div>
    <div id="volume">
      <button id="mute" type="button" aria-label="Mute">🔊</button>
      <input id="volume-slider" type="range" min="0" max="100" step="5" aria-label="Volume" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
